<head>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
	<style>
	* {
  			font-family: "Press Start 2P", system-ui;
  			font-weight: 400;
  			font-style: normal;
	}
	body {
		background-color: black;
	}

	h1{
		margin: 0;
	}

	button {
		background-color: transparent;
		border: 1px solid rgba(0, 0, 0, 0.3);
		border: 0;
		color: #000;
		font-size: 15px;
		cursor: pointer;
		transition: background-color 0.2s ease;
	}

	button:hover {
		background-color: rgba(255, 255, 255, 1);
		color: #949402;
	}
	</style>
</head>
<div style="display: inline-block; position: relative;">
	<div 
	id = "overlappingDiv"
	style="
	background-color: black; 
	position: absolute; 
	top: 0; 
	right: 0; 
	bottom: 0; 
	left: 0;
	opacity: 0; 
	pointer-events: none;
	z-index: 10;">
	</div>

	<canvas></canvas>

	<div id="userInterface" style="display: none";>

	<!--represents health bar of the king (enemy)-->
<div style="
	background-color: rgba(234, 237, 210, 0.85); 
	position: absolute;
	width: 250px;
	top: 40px;
	left: 70px;
	border: 1px black solid;
	padding: 12px;">
	
	<h1 style="font-size: 18px;">The Molted King</h1>
	<div style="position: relative;">
		<div style="height: 5px; background-color: #ccc; margin-top: 8px;"></div>
		<div id="enemyHealthBar" style="
		height: 5px; 
		background-color: indianred; 
		position: absolute; 
		top: 0;
		left: 0;
		right: 0;"></div>
	</div>
	</div>

<!--represents health bar of the hero (us)-->
	<div style="
	background-color: rgba(234, 237, 210, 0.85); 
	position: absolute;
	width: 250px;
	top: 330px;
	right: 50px;
	border: 1px black solid;
	padding: 12px;">
	
	<h1 style="font-size: 15px;">A Hero</h1>
	<div style="position: relative;">
		<div style="height: 5px; background-color: #ccc; margin-top: 8px;"></div>
		<div id="playerHealthBar" style="
		height: 5px; 
		background-color: green; 
		position: absolute; 
		top: 0;
		left: 0;
		right: 0;"></div>
	</div>
	</div>

	<div style="
	background-color: rgba(234, 237, 210, 0.85);
	height: 125px;
	position: absolute;
	bottom: 0;
	left: 0;
	right: 0;
	border-top: 2px black solid;
	display: flex;">

	<div 
	id="dialogueBox"
	style ="
	position: absolute;
	top: 0;
	right: 0;
	bottom: 0;
	left: 0;
	background-color: rgba(234, 237, 210, 1);
	padding: 12px;
	display: none;
	cursor: pointer;
	z-index: 10;">
	varflins</div>

	<div 
	id = "attacksBox"
	style=" 
	width: 66.66%;
	display: grid;
	grid-template-columns: repeat(2, 1fr);
	">
	</div>

	<div style="
	display: flex;
	align-items: center;
	justify-content: center;
	width: 33.33%;
	border-left: 2px black solid;">
		<h1 id = "attackType" style="font-size: 18px;">Attack Type</h1>
	</div>
	</div>
</div>
</div>
<div id="bioModal" 
	style="display: none; 
	position: absolute; inset: 0; 
	background-color: rgba(0, 0, 0, 0.85); 
	z-index: 50; flex-direction: 
	column; align-items: 
	center; justify-content: 
	center; cursor: pointer;">

    <div style="
    position: relative;
    max-width: 96%; 
    max-height: 86%; 
    display: flex; 
    flex-direction: column; 
    align-items: center;">

      <h2 id="bioModalTitle" style="color: #fbbf24; font-family: sans-serif; margin-bottom: 12px; font-size: 20px;">Biochemistry Result</h2>

      <img id="bioModalImg" src="" alt="Treasure #1" style="
      width: 750px;
      max-width: 92vw; 
      max-height: 70vh; 
      object-fit: contain; 
      border: 4px solid #fff; 
      border-radius: 8px; 
      box-shadow: 0 0 20px rgba(0,0,0,0.8);
      "/>

      <p style="color: #d1d5db; font-family: sans-serif; margin-top: 12px; font-size: 14px;"></p>
    </div>
  </div>
<script 
	src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js" 
	integrity="sha512-6+YN/9o9BWrk6wSfGxQGpt3EUK6XeHi6yeHV+TYD2GR0Sj/cggRpXr1BrAQf0as6XslxomMUxXp2vIl+fv0QRA==" crossorigin="anonymous"

	crossorigin="anonymous" 
	referrerpolicy="no-referrer"></script>
