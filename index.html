<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Hero and The King</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Press Start 2P", system-ui;
      font-weight: 400;
      font-style: normal;
    }

    body {
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden; /* ซ่อน scrollbar */
    }

    #gameContainer {
      position: relative;
      width: 100vw;
      height: 100vh;
      max-width: 177.78vh; /* 16/9 = 1.7778 */
      max-height: 56.25vw;  /* 9/16 = 0.5625 */
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: black;
    }

    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      object-fit: contain;
      image-rendering: pixelated;
    }

    h1 {
      margin: 0;
    }

    #attacksBox button {
      background-color: transparent;
      border: 1px solid rgba(0, 0, 0, 0.3);
      border: 0;
      color: #000;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    #attacksBox button:hover {
      background-color: rgba(255, 255, 255, 1);
      color: #949402;
    }

    #fullscreenBtn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      border: 1.5px solid #fff;
      border-radius: 4px;
      padding: 6px 10px;
      font-size: 10px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    #fullscreenBtn:hover {
      background: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
<body>

  <div id="gameContainer">
    <button id="fullscreenBtn">⛶ fullscreen</button>

    <div 
      id="overlappingDiv"
      style="
        background-color: black; 
        position: absolute; 
        inset: 0;
        opacity: 0; 
        pointer-events: none;
        z-index: 10;">
    </div>

    <canvas></canvas>

    <div id="userInterface" style="display: none;">
      <!-- แถบเลือดของ The Molted King (ศัตรู) -->
      <div style="
        background-color: rgba(234, 237, 210, 0.85); 
        position: absolute;
        width: 250px;
        top: 40px;
        left: 70px;
        border: 1px black solid;
        padding: 12px;
        z-index: 5;">
        <h1 style="font-size: 18px;">The Molted King</h1>
        <div style="position: relative;">
          <div style="height: 5px; background-color: #ccc; margin-top: 8px;"></div>
          <div id="enemyHealthBar" style="
            height: 5px; 
            background-color: indianred; 
            position: absolute; 
            top: 0;
            left: 0;
            right: 0;"></div>
        </div>
      </div>

      <!-- แถบเลือดของ A Hero (ผู้เล่น) -->
      <div style="
        background-color: rgba(234, 237, 210, 0.85); 
        position: absolute;
        width: 250px;
        top: 330px;
        right: 50px;
        border: 1px black solid;
        padding: 12px;
        z-index: 5;">
        <h1 style="font-size: 15px;">A Hero</h1>
        <div style="position: relative;">
          <div style="height: 5px; background-color: #ccc; margin-top: 8px;"></div>
          <div id="playerHealthBar" style="
            height: 5px; 
            background-color: green; 
            position: absolute; 
            top: 0;
            left: 0;
            right: 0;"></div>
        </div>
      </div>

      <!-- แถบเมนูด้านล่าง -->
      <div style="
        background-color: rgba(234, 237, 210, 0.85);
        height: 125px;
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        border-top: 2px black solid;
        display: flex;
        z-index: 5;">

        <div 
          id="dialogueBox"
          style="
            position: absolute;
            inset: 0;
            background-color: rgba(234, 237, 210, 1);
            padding: 12px;
            display: none;
            cursor: pointer;
            z-index: 10;">
          varflins
        </div>

        <div 
          id="attacksBox"
          style=" 
            width: 66.66%;
            display: grid;
            grid-template-columns: repeat(2, 1fr);">
        </div>

        <div style="
          display: flex;
          align-items: center;
          justify-content: center;
          width: 33.33%;
          border-left: 2px black solid;">
          <h1 id="attackType" style="font-size: 18px;">Attack Type</h1>
        </div>
      </div>
    </div>

    <!-- Biochemistry Test Result Modal -->
    <div id="bioModal" style="
      display: none; 
      position: absolute; 
      inset: 0; 
      background-color: rgba(0, 0, 0, 0.85); 
      z-index: 50; 
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      cursor: pointer;">
      
      <div style="
        position: relative;
        max-width: 96%; 
        max-height: 86%; 
        display: flex; 
        flex-direction: column; 
        align-items: center;">
        <h2 id="bioModalTitle" style="color: #fbbf24; margin-bottom: 12px; font-size: 20px;">Biochemistry Result</h2>
        <img id="bioModalImg" src="" alt="Result" style="
          width: 750px;
          max-width: 92vw; 
          max-height: 70vh; 
          object-fit: contain; 
          border: 4px solid #fff; 
          border-radius: 8px; 
          box-shadow: 0 0 20px rgba(0,0,0,0.8);
        "/>
        <p style="color: #d1d5db; margin-top: 12px; font-size: 14px;">(Click anywhere to close)</p>
      </div>
    </div>
  </div>

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.3/howler.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.9.1/gsap.min.js" crossorigin="anonymous"></script>

  <!-- Data Files -->
  <script src="data/audio.js"></script>
  <script src="data/battleZones.js"></script>
  <script src="data/collisions.js"></script>
  <script src="data/attacks.js"></script>
  <script src="data/monsters.js"></script>
  <script src="data/questions.js"></script>
  <script src="data/treasureZones.js"></script>
  <script src="data/treasureItems.js"></script>
  <script src="data/tombZones.js"></script>

  <!-- Classes & Game Logic -->
  <script src="classes.js"></script>
  <script src="index.js"></script>
  <script src="battleScene.js"></script>

  <!-- สคริปต์ควบคุมปุ่มเต็มจอ -->
  <script>
    const fullscreenBtn = document.querySelector('#fullscreenBtn')
    const gameContainer = document.querySelector('#gameContainer')

    fullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        if (gameContainer.requestFullscreen) {
          gameContainer.requestFullscreen()
        } else if (gameContainer.webkitRequestFullscreen) {
          gameContainer.webkitRequestFullscreen()
        }
        fullscreenBtn.innerText = '✖ Exit'
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen()
        }
        fullscreenBtn.innerText = '⛶ เต็มจอ'
      }
    })
  </script>
</body>
</html>
