<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>2D Pixel VetTech - Fixed Jump</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Courier New', Courier, monospace;
        }
        canvas {
            display: block;
            image-rendering: pixelated; /* ให้กราฟิกคงความคมชัดแบบ Pixel Art */
        }
    </style>
</head>
<body class="bg-black relative w-full h-full">

    <div id="canvas-container" class="w-full h-full absolute inset-0"></div>

    <div class="absolute top-4 left-4 z-10 bg-black/60 backdrop-blur-md border-2 border-amber-500/50 text-amber-200 p-4 rounded-xl shadow-lg max-w-xs pointer-events-none">
        <h1 class="text-lg font-bold tracking-wider text-amber-400 mb-1">VetTech Adventure</h1>
        <p class="text-xs text-amber-100/80 mb-2">2D Side-scrolling</p>
        <div class="text-xs space-y-1 bg-black/40 p-2 rounded border border-amber-900/40">
            <p>⌨️ <b class="text-white">A / D</b> หรือ <b class="text-white">← / →</b> : เดิน</p>
            <p>🚀 <b class="text-white">Spacebar / W / ↑</b> : กระโดด</p>
            <p>🖱️ <b class="text-white">Click / Touch</b> : แตะหน้าจอเพื่อกระโดด</p>
        </div>
    </div>

    <div id="name-tag" class="absolute z-10 pointer-events-none transform -translate-x-1/2 -translate-y-full transition-opacity duration-200">
        <div class="bg-black/70 border border-amber-400 text-amber-300 text-xs px-2 py-0.5 rounded-full font-bold shadow-md tracking-wide flex items-center gap-1">
            <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
            <span>Adventurer</span>
        </div>
    </div>

    <script>
        // --- 1. SET UP SCENE, CAMERA, RENDERER ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();

        const aspect = window.innerWidth / window.innerHeight;
        const frustumSize = 14;
        const camera = new THREE.OrthographicCamera(
            frustumSize * aspect / -2,
            frustumSize * aspect / 2,
            frustumSize / 2,
            frustumSize / -2,
            0.1,
            1000
        );
        camera.position.set(0, 0, 10);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        // --- 2. LIGHTING & ATMOSPHERE ---
        const ambientLight = new THREE.AmbientLight(0xffaa77, 0.95);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xff6622, 0.8);
        sunLight.position.set(-5, 5, 5);
        scene.add(sunLight);

        // --- 3. PIXEL PROCEDURAL TEXTURES ---
        function createPixelTexture(width, height, drawFn) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            drawFn(ctx, width, height);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;
            return texture;
        }

        const skyTexture = createPixelTexture(64, 128, (ctx, w, h) => {
            const skyHeight = h * 0.55;
            const grad = ctx.createLinearGradient(0, 0, 0, skyHeight);
            grad.addColorStop(0, '#3b103f');
            grad.addColorStop(0.35, '#a82c6c');
            grad.addColorStop(0.7, '#f05a28');
            grad.addColorStop(1, '#ffc04d');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, w, skyHeight);

            ctx.fillStyle = '#FCF6B3';
            ctx.fillRect(w/2 - 4, skyHeight - 12, 8, 8);

            const seaHeight = h * 0.45;
            const seaGrad = ctx.createLinearGradient(0, skyHeight, 0, h);
            seaGrad.addColorStop(0, '#f26835');
            seaGrad.addColorStop(0.2, '#912140');
            seaGrad.addColorStop(0.6, '#36153b');
            seaGrad.addColorStop(1, '#180a24');
            ctx.fillStyle = seaGrad;
            ctx.fillRect(0, skyHeight, w, seaHeight);

            ctx.fillStyle = '#FFAD4D';
            for (let y = skyHeight + 2; y < h; y += 3) {
                const rowRatio = (y - skyHeight) / seaHeight;
                const waveWidth = Math.max(1, Math.floor((1 - rowRatio) * 8));
                const offsetX = (Math.sin(y * 8) * 2);
                ctx.fillRect(w/2 - waveWidth/2 + offsetX, y, waveWidth, 1);
            }
        });

        const skyBg = new THREE.Mesh(
            new THREE.PlaneGeometry(80, 24),
            new THREE.MeshBasicMaterial({ map: skyTexture })
        );
        skyBg.position.set(0, 3, -5);
        scene.add(skyBg);

        // --- 4. GROUND & ENVIRONMENT ---
        const WORLD_WIDTH = 120;
        const GROUND_Y = -3.8;

        const grassMat = new THREE.MeshLambertMaterial({ color: 0x4d7c0f });
        const dirtMat = new THREE.MeshLambertMaterial({ color: 0x5c3a21 });

        const grassGround = new THREE.Mesh(new THREE.BoxGeometry(WORLD_WIDTH, 0.5, 1), grassMat);
        grassGround.position.set(0, GROUND_Y, 0);
        scene.add(grassGround);

        const dirtGround = new THREE.Mesh(new THREE.BoxGeometry(WORLD_WIDTH, 5, 1), dirtMat);
        dirtGround.position.set(0, GROUND_Y - 2.75, 0);
        scene.add(dirtGround);

        const treeTrunkMat = new THREE.MeshLambertMaterial({ color: 0x4a2e18 });
        const treeLeavesMat = new THREE.MeshLambertMaterial({ color: 0x226622 });
        const bushMat = new THREE.MeshLambertMaterial({ color: 0x338833 });
        const rockMat = new THREE.MeshLambertMaterial({ color: '#7A7A7A' }); 

        for (let x = -WORLD_WIDTH / 2 + 3; x < WORLD_WIDTH / 2 - 3; x += 2.5 + Math.random() * 4) {
            if (Math.abs(x) < 2) continue;

            const rand = Math.random();
            const baseY = GROUND_Y + 0.25;

            if (rand < 0.45) {
                const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.4, 1.8, 0.2), treeTrunkMat);
                trunk.position.set(x, baseY + 0.9, -0.1);
                
                const leaves = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.6, 0.3), treeLeavesMat);
                leaves.position.set(x, baseY + 2.3, 0);
                
                const leavesTop = new THREE.Mesh(new THREE.BoxGeometry(1.0, 0.8, 0.3), treeLeavesMat);
                leavesTop.position.set(x, baseY + 3.3, 0);

                scene.add(trunk, leaves, leavesTop);
            } else if (rand < 0.75) {
                const bush = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.6, 0.2), bushMat);
                bush.position.set(x, baseY + 0.3, 0.1);
                scene.add(bush);
            } else {
                const rock = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.4, 0.2), rockMat);
                rock.position.set(x, baseY + 0.2, 0.1);
                scene.add(rock);
            }
        }

        // --- 5. CHARACTER BUILDER ---
        const playerGroup = new THREE.Group();

        const skinMat = new THREE.MeshLambertMaterial({ color: 0xffdbac });
        const shirtMat = new THREE.MeshLambertMaterial({ color: 0xe74c3c });
        const pantsMat = new THREE.MeshLambertMaterial({ color: 0x2980b9 });
        const hairMat = new THREE.MeshLambertMaterial({ color: 0x3d2314 });

        const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.3), skinMat);
        head.position.y = 0.65;
        playerGroup.add(head);

        const hair = new THREE.Mesh(new THREE.BoxGeometry(0.54, 0.2, 0.34), hairMat);
        hair.position.set(0, 0.85, 0);
        playerGroup.add(hair);

        const body = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.6, 0.25), shirtMat);
        body.position.y = 0.1;
        playerGroup.add(body);

        const armGeo = new THREE.BoxGeometry(0.12, 0.5, 0.15);
        armGeo.translate(0, -0.2, 0);

        const leftArm = new THREE.Mesh(armGeo, skinMat);
        leftArm.position.set(-0.3, 0.35, 0);
        playerGroup.add(leftArm);

        const rightArm = new THREE.Mesh(armGeo, skinMat);
        rightArm.position.set(0.3, 0.35, 0);
        playerGroup.add(rightArm);

        const legGeo = new THREE.BoxGeometry(0.16, 0.5, 0.18);
        legGeo.translate(0, -0.2, 0);

        const leftLeg = new THREE.Mesh(legGeo, pantsMat);
        leftLeg.position.set(-0.12, -0.2, 0);
        playerGroup.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeo, pantsMat);
        rightLeg.position.set(0.12, -0.2, 0);
        playerGroup.add(rightLeg);

        const PLAYER_BASE_Y = GROUND_Y + 0.8;
        playerGroup.position.set(0, PLAYER_BASE_Y, 0.5);
        scene.add(playerGroup);

        // แม่มด (NPC)
        const npc = new THREE.Group();
        const witchBody = new THREE.Mesh(
            new THREE.BoxGeometry(0.5, 0.8, 0.3),
            new THREE.MeshLambertMaterial({ color: '#693D78' })
        );
        witchBody.position.x = 55.0;
        witchBody.position.y = -3.2;
        witchBody.castShadow = true;
        npc.add(witchBody);

        const witchHat = new THREE.Mesh(
            new THREE.ConeGeometry(0.4, 0.6, 4),
            new THREE.MeshLambertMaterial({ color: '#693D78' })
        );
        witchHat.position.x = 55.0;
        witchHat.position.y = -2.5;
        witchHat.castShadow = true;
        npc.add(witchHat);

        const questGeo = new THREE.BoxGeometry(0.1, 0.3, 0.1);
        const questDotGeo = new THREE.BoxGeometry(0.1, 0.1, 0.1);
        const questMat = new THREE.MeshBasicMaterial({ color: 0xffeb3b });
        const questIcon = new THREE.Group();
        
        const qTop = new THREE.Mesh(questGeo, questMat);
        const qBot = new THREE.Mesh(questDotGeo, questMat);
        qTop.position.x = 55.0;
        qTop.position.y = -1.8;
        qBot.position.x = 55.0;
        qBot.position.y = -1.55;
        questIcon.add(qTop, qBot);
        npc.add(questIcon);

        npc.position.set(0, 0, 0.5);
        scene.add(npc);

        // --- 6. CONTROLS & LOGIC ---
        const keys = { left: false, right: false };
        const moveSpeed = 0.08;
        let walkCycle = 0;
        let isMoving = false;
        let facingDirection = 1;

        let velocityY = 0;
        const gravity = -0.015;
        const jumpPower = 0.28;
        let isJumping = false;

        function triggerJump() {
            if (!isJumping) {
                velocityY = jumpPower;
                isJumping = true;
            }
        }

        window.addEventListener('keydown', (e) => {
            const code = e.code;
            const key = e.key.toLowerCase();
            
            if (code === 'KeyA' || key === 'a' || code === 'ArrowLeft' || key === 'arrowleft') {
                keys.left = true;
            }
            if (code === 'KeyD' || key === 'd' || code === 'ArrowRight' || key === 'arrowright') {
                keys.right = true;
            }
            if (code === 'Space' || code === 'KeyW' || key === 'w' || code === 'ArrowUp' || key === 'arrowup') {
                triggerJump();
            }
        });

        window.addEventListener('keyup', (e) => {
            const code = e.code;
            const key = e.key.toLowerCase();

            if (code === 'KeyA' || key === 'a' || code === 'ArrowLeft' || key === 'arrowleft') {
                keys.left = false;
            }
            if (code === 'KeyD' || key === 'd' || code === 'ArrowRight' || key === 'arrowright') {
                keys.right = false;
            }
        });

        window.addEventListener('mousedown', () => triggerJump());
        window.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) triggerJump();
        }, { passive: true });

        // --- 7. NAME TAG POSITIONING ---
        const nameTag = document.getElementById('name-tag');
        const tempVec = new THREE.Vector3();

        function updateNameTag() {
            tempVec.copy(playerGroup.position);
            tempVec.y += 1.2;
            tempVec.project(camera);

            const x = (tempVec.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-(tempVec.y * 0.5) + 0.5) * window.innerHeight;

            nameTag.style.left = `${x}px`;
            nameTag.style.top = `${y}px`;
        }

        // --- 8. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // คำนวณการเดิน
            isMoving = false;
            if (keys.left) {
                playerGroup.position.x -= moveSpeed;
                facingDirection = -1;
                isMoving = true;
            }
            if (keys.right) {
                playerGroup.position.x += moveSpeed;
                facingDirection = 1;
                isMoving = true;
            }

            // ระบบฟิสิกส์แรงโน้มถ่วงและการกระโดด
            if (isJumping) {
                playerGroup.position.y += velocityY;
                velocityY += gravity;

                // เช็คเมื่อผู้เล่นตกถึงพื้น (แก้ไขปัญหาค้างเรียบร้อย)
                if (playerGroup.position.y <= PLAYER_BASE_Y) {
                    playerGroup.position.y = PLAYER_BASE_Y;
                    velocityY = 0;
                    isJumping = false;
                }
            }

            // ขอบเขตแมพ
            const maxBound = WORLD_WIDTH / 2 - 2;
            playerGroup.position.x = THREE.MathUtils.clamp(playerGroup.position.x, -maxBound, maxBound);

            // กลับด้านตัวละครตามทิศที่เดิน
            playerGroup.scale.x = facingDirection;

            // แอนิเมชัน (เดิน vs กระโดด)
            if (isJumping) {
                leftArm.rotation.z = 0.8;
                rightArm.rotation.z = -0.8;
                leftLeg.rotation.z = -0.4;
                rightLeg.rotation.z = 0.4;
            } else if (isMoving) {
                walkCycle += 0.15;
                const angle = Math.sin(walkCycle) * 0.6;
                
                leftArm.rotation.z = angle;
                rightArm.rotation.z = -angle;
                leftLeg.rotation.z = -angle;
                rightLeg.rotation.z = angle;
                
                playerGroup.position.y = PLAYER_BASE_Y + Math.abs(Math.sin(walkCycle * 2)) * 0.05;
            } else {
                walkCycle = 0;
                leftArm.rotation.z = THREE.MathUtils.lerp(leftArm.rotation.z, 0, 0.2);
                rightArm.rotation.z = THREE.MathUtils.lerp(rightArm.rotation.z, 0, 0.2);
                leftLeg.rotation.z = THREE.MathUtils.lerp(leftLeg.rotation.z, 0, 0.2);
                rightLeg.rotation.z = THREE.MathUtils.lerp(rightLeg.rotation.z, 0, 0.2);
                playerGroup.position.y = PLAYER_BASE_Y;
            }

            // Follow Camera
            camera.position.x = THREE.MathUtils.lerp(camera.position.x, playerGroup.position.x, 0.08);
            skyBg.position.x = camera.position.x;

            // อัปเดตตำแหน่ง Name Tag
            updateNameTag();

            renderer.render(scene, camera);
        }

        // --- 9. RESIZE HANDLER ---
        window.addEventListener('resize', () => {
            const aspect = window.innerWidth / window.innerHeight;
            camera.left = -frustumSize * aspect / 2;
            camera.right = frustumSize * aspect / 2;
            camera.top = frustumSize / 2;
            camera.bottom = -frustumSize / 2;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // เริ่มรันเกม
        animate();
    </script>
</body>
</html>
